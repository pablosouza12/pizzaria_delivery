<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzaria Delivery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 pb-20">
    <div class="bg-red-900 text-white text-center py-2 text-sm font-bold">
        Aberto: Seg a Sex (17h-22h) | Sáb e Dom (17h-23h)
    </div>
    <header class="bg-red-600 text-white text-center py-6 shadow-md">
        <h1 class="text-3xl font-bold">🍕 Pizzaria Delivery</h1>
        <p class="text-sm mt-1">O melhor sabor, direto para você!</p>
    </header>
    <main class="max-w-4xl mx-auto mt-6 px-4">
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Pizzas</h2>
        <div id="pizza-menu" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8"></div>
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Bebidas (1L)</h2>
        <div id="drink-menu" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8"></div>
    </main>

    <!-- Floating Cart Button -->
    <button id="cart-btn" class="fixed bottom-4 right-4 bg-green-500 text-white p-4 rounded-full shadow-lg font-bold text-lg hover:bg-green-600 transition flex items-center gap-2">
        🛒 Carrinho (<span id="cart-count">0</span>)
    </button>

    <!-- Cart Sidebar -->
    <div id="cart-sidebar" class="fixed top-0 right-0 w-full md:w-96 h-full bg-white shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col z-50">
        <div class="p-4 bg-red-600 text-white flex justify-between items-center">
            <h2 class="text-xl font-bold">Seu Pedido</h2>
            <button id="close-cart" class="text-2xl">&times;</button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-4">
            <!-- Items go here -->
        </div>
        <div class="p-4 border-t border-gray-200 bg-gray-50">
            <div class="mb-3">
                <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Entrega</label>
                <select id="delivery-type" class="w-full p-2 border rounded">
                    <option value="retirada">Retirada no Local</option>
                    <option value="entrega">Entrega em Domicílio</option>
                </select>
            </div>
            <div id="delivery-fields" class="hidden space-y-3 mb-3">
                <select id="bairro" class="w-full p-2 border rounded">
                    <option value="">Selecione o Bairro...</option>
                    <option value="Centro" data-tax="5.00">Centro - R$ 5,00</option>
                    <option value="Santo Antônio" data-tax="7.00">Santo Antônio - R$ 7,00</option>
                    <option value="Boa Vista" data-tax="8.00">Boa Vista - R$ 8,00</option>
                    <option value="Pina" data-tax="12.00">Pina - R$ 12,00</option>
                    <option value="Boa Viagem" data-tax="15.00">Boa Viagem - R$ 15,00</option>
                </select>
                <div class="flex gap-2">
                    <input type="text" id="rua" placeholder="Rua" class="w-2/3 p-2 border rounded">
                    <input type="text" id="numero" placeholder="Nº" class="w-1/3 p-2 border rounded">
                </div>
            </div>
            
            <div class="flex justify-between font-medium text-gray-600">
                <span>Subtotal:</span>
                <span>R$ <span id="subtotal">0.00</span></span>
            </div>
            <div class="flex justify-between font-medium text-gray-600 mt-1">
                <span>Taxa de Entrega:</span>
                <span>R$ <span id="delivery-fee">0.00</span></span>
            </div>
            <div class="flex justify-between font-bold text-xl text-gray-800 mt-3 border-t pt-2">
                <span>Total:</span>
                <span>R$ <span id="total">0.00</span></span>
            </div>
            <button id="checkout-btn" class="w-full bg-green-500 text-white font-bold py-3 rounded-lg mt-4 hover:bg-green-600 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                Enviar Pedido p/ WhatsApp
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
